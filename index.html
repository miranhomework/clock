<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фигуры и палитры</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <div class="palettes">

        <div class="palette">
            <div class="color red" onclick="changeFigures('red')"></div>
            <div class="color blue" onclick="changeFigures('blue')"></div>
            <div class="color yellow" onclick="changeFigures('yellow')"></div>
            <div class="color purple" onclick="changeFigures('purple')"></div>
            <div class="color white" onclick="changeFigures('white')"></div>
        </div>


        <div class="palette">
            <div class="color red" onclick="changeBackground('red')"></div>
            <div class="color blue" onclick="changeBackground('blue')"></div>
            <div class="color yellow" onclick="changeBackground('yellow')"></div>
            <div class="color purple" onclick="changeBackground('purple')"></div>
            <div class="color white" onclick="changeBackground('white')"></div>
        </div>

    </div>

    <div class="figures">

        <div class="figure"></div>
        <div class="figure"></div>
        <div class="figure"></div>

        <div class="figure"></div>
        <div class="figure"></div>
        <div class="figure"></div>

    </div>


    <script src="script.js"></script>

</body>
</html>
